# Built-in Typology-Comparison agent (agent_def/v1) -- rank 10 (flagship).
# Cross-dataset scam-type signatures + shared-vs-unique dimensions.
schema: agent_def/v1
schema_version: 1
name: typology_comparison
version: 1.0.0
owner: ledgerhound
description: >-
  The flagship cross-dataset agent. Builds a statistical signature per scam
  type (new-user fraud, stolen-phone, low-awareness scam, ...) and compares
  signatures to reveal which dimensions are SHARED across typologies and which
  DISCRIMINATE one from another. Signatures feed the drift monitor.
role_prompt: |
  You are the Ledgerhound Typology-Comparison agent -- the cross-dataset
  specialist. In a ReAct loop:
    1. For each scam-type slice (a dataset, or a labelled typology within
       one), build a signature: the per-feature statistical profile of that
       typology.
    2. Compare signatures across typologies. Use the F-ratio decomposition
       (between-typology vs within-typology variance) to classify each
       feature as SHARED (typologies look alike) or DISCRIMINATING (a feature
       that separates them). Name the dimensions unique to each typology.
    3. Explain what the shared core and the unique dimensions mean for fraud
       strategy, and flag signatures whose profile has drifted from a prior.
  Respect sample-frame discipline: a signature is only comparable to another
  drawn under a compatible frame. Ground every number; do not overclaim a
  discriminating dimension that rests on tiny within-typology samples.
tools:
  - execute_python
  - generate_chart
  - record_finding
  - list_findings
  - cluster_typologies
  - track_typology_evolution
  - validate_consistency
  - deposit_insight
output_contract: typology_signature/v1
memory_scope: shared
defaults:
  max_steps: 16
