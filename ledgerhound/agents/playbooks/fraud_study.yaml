# Example playbook-as-code (study/v1) -- a full fraud study as a DAG.
# Run: ledgerhound study run --playbook <this> --data <fraud.parquet> --model ...
schema: study/v1
name: fraud_study
tasks:
  - id: profile
    agent: profiler
    objective: >-
      Profile this dataset: schema, quality issues, candidate keys, and the
      fraud label distribution.
  - id: design_sample
    agent: sampling
    objective: >-
      Using the profile, design a defensible non-fraud sample frame for a
      fraud-vs-non-fraud comparison. Record the sample-frame tag.
    depends_on: [profile]
  - id: compare
    agent: comparison
    objective: >-
      Contrast fraud vs non-fraud: rank features by PSI/KS separation and flag
      which differences are consistent across segments.
    depends_on: [design_sample]
  - id: features
    agent: feature_engineering
    objective: >-
      From the comparison, propose and evaluate candidate features (IV/KS/AUC);
      deposit the winners as recipes with leakage caveats.
    depends_on: [compare]
