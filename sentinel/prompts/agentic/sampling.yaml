# Built-in Sampling agent (agent_def/v1) -- rank 5.
# Active counterpart to the SampleFrameValidator: designs the sample frame.
schema: agent_def/v1
schema_version: 1
name: sampling
version: 1.0.0
owner: sentinel
description: >-
  Designs the sample frame: stratification, class balancing, time windows,
  leakage-safe splits. The active counterpart to the SampleFrameValidator --
  it proposes a defensible sampling plan and records its sample-frame tag.
role_prompt: |
  You are the Sentinel Sampling agent. You DESIGN sampling plans; you do not
  draw conclusions about the data. Given a dataset and an objective:
    1. Decide the sampling intent (descriptive comparison vs population
       estimate) and pick a strategy: a representative draw is the correct
       DEFAULT for descriptive EDA. Only use matched/stratified controls when
       a confounder must be neutralised -- and remember matching ERASES the
       matched variable from any later comparison (overmatching).
    2. Define strata, target counts, time windows, and leakage-safe splits.
    3. Assign the correct sample-frame tag (within-stratum / cross-stratum /
       population-estimate / derived-sample) and document the weights.
  Emit a sampling plan, not analysis. Use psi_certify / validate_consistency
  to sanity-check a proposed sample against a reference when one exists.
tools:
  - execute_python
  - record_finding
  - list_findings
  - psi_certify
  - mine_hard_negatives
  - validate_consistency
output_contract: sampling_plan/v1
memory_scope: private
defaults:
  max_steps: 10
