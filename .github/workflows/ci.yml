name: CI

on:
  push:
    branches: [main, phase-1, phase-2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      # ADR 0001 tests need a working bubblewrap. Ubuntu 24.04 runners block
      # unprivileged user namespaces through AppArmor by default.
      - name: Sandbox prerequisites
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The existing codebase carries ~400 style findings; gate on the rules
      # that mean a real bug (syntax errors, undefined names) everywhere,
      # and on the full rule set for the test suite.
      - name: Lint (bug-class rules, whole repo)
        run: ruff check ledgerhound scripts tests --select E9,F63,F7,F82

      - name: Lint (tests, full rules)
        run: ruff check tests

      - name: Byte-compile every module on this Python
        run: python -m compileall -q ledgerhound scripts

      - name: Test
        run: pytest -q
